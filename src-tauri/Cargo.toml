[package]
name = "firefly-ai-engine"
version = "0.1.0"
description = "Firefly AI Engine - Tier 2 独立 AI 推理引擎守护服务"
authors = ["Firefly Team"]
edition = "2021"
rust-version = "1.77"

# Tauri lib 配置
[lib]
name = "firefly_ai_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "firefly-ai-engine"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# HTTP 服务（Axum 网关）
axum = { version = "0.8", features = ["http2", "macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP 客户端（反向代理 + 健康检测）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 进程管理
tokio-util = { version = "0.7", features = ["codec", "io"] }

# 流处理（SSE 反代）
futures = "0.3"

# 错误处理
anyhow = "1"
thiserror = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 文件路径工具
dirs = "5"
walkdir = "2"

# 正则表达式（stderr 错误分类）
regex = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# bytes（反代流）
bytes = "1"

# HTTP 消息体
http-body-util = "0.1"
rfd = "0.17.2"

# 校验与解压
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
mockito = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
